<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Background: solid dark square, no rounding — brutalist -->
  <rect x="0" y="0" width="64" height="64" fill="#0A0A0A"/>

  <!-- Document outline -->
  <rect x="16" y="10" width="26" height="34" fill="none" stroke="#F5F5F0" stroke-width="2.5"/>

  <!-- Folded corner -->
  <path d="M 34 10 L 42 18 L 34 18 Z" fill="#F5F5F0"/>

  <!-- Text lines (data rows) -->
  <rect x="20" y="20" width="14" height="2" fill="#F5F5F0"/>
  <rect x="20" y="25" width="18" height="2" fill="#F5F5F0"/>
  <rect x="20" y="30" width="10" height="2" fill="#F5F5F0"/>

  <!-- Scan / intelligence marker: crosshair-magnifier, offset bottom-right, accent color -->
  <circle cx="40" cy="40" r="9" fill="#0A0A0A" stroke="#00FF41" stroke-width="2.5"/>
  <line x1="46.5" y1="46.5" x2="54" y2="54" stroke="#00FF41" stroke-width="3" stroke-linecap="square"/>
  <line x1="40" y1="35" x2="40" y2="45" stroke="#00FF41" stroke-width="1.5"/>
  <line x1="35" y1="40" x2="45" y2="40" stroke="#00FF41" stroke-width="1.5"/>
</svg>
